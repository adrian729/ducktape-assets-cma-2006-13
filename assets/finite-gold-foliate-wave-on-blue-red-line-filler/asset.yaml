# descriptive: find it and understand it
id: finite-gold-foliate-wave-on-blue-red-line-filler
title: Gold leaf wave on blue and red line filler
description: A short horizontal line filler. A gold stem waves along a narrow bar whose left half is blue and right half red-brown, throwing gold leaves above and below, with a small gold curl hanging under the blue half at the left end. The ends are finite and slightly ragged; the painted bar is opaque and the background is transparent.
