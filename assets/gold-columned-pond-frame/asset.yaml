# descriptive: find it and understand it
id: gold-columned-pond-frame
title: Gold columned frame of the pond miniature
description: The architectural frame of the pond miniature with its interior removed. A wide horizontal rectangle bounded by two gold columns with spiral-scroll capitals and bases, a thin gold bar with a red-brown rule along the top and a slightly deeper gold plinth bar along the bottom. The gold is worn and shows green and tan ground in places. Only the paint is opaque; the interior and the surround are transparent.
