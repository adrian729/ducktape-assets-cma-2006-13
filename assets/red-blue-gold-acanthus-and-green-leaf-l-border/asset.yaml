# descriptive: find it and understand it
id: red-blue-gold-acanthus-and-green-leaf-l-border
title: Acanthus and flower L-border, top and right
description: An L-shaped page border along the top and right edges with its vertex at the top right. The top bar is a gold band speckled with black dots carrying green leaf sprigs, a red-brown caterpillar and a red fruit with a green calyx, ending in blue and red-brown acanthus curls at the left. The vertex is a knot of blue, red and gold acanthus. The long right bar alternates diagonal panels of speckled gold with green leaves, a blue flower, a red flower and red buds against openwork sections of blue and gold acanthus scrolls. The background is transparent.
