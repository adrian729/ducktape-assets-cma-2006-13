id: diving-long-beaked-waterbird
title: Long-beaked waterbird diving head first
description: A grey-brown waterbird with a long pointed beak plunges head first towards the lower left, both wings raised over its back with gold feather hatching and its two long gold legs trailing behind to the right. The breast is pale grey, the head dark with a small gold-ringed eye. Cut from the pond miniature of the leaf; the background is transparent.
