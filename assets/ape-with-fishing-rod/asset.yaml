# descriptive: find it and understand it
id: ape-with-fishing-rod
title: Crouching ape holding a fishing rod
description: A brown ape with gold-hatched fur crouches on its haunches facing right, its tail curling behind, and holds a long thin fishing rod in both hands; the rod rises to a peak above and the line bends down to the right. Round ear, dark eye and a long muzzle. The paint is worn, with pale parchment showing through the fur. Cut from the pond miniature of the leaf; the background is transparent.
